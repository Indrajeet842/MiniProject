<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Notice Board</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="student-theme">

<!-- SNOW -->
<canvas id="snow"></canvas>

<!-- 🔐 LOGIN PAGE -->
<div id="login-page" class="login-container">

  <!-- IMPORTANT: changed to login-card (your CSS uses this) -->
  <div class="login-card">

    <h2 id="login-title">🎓 Student Login</h2>

    <select id="role">
      <option value="student">🎓 Student</option>
      <option value="teacher">👨‍🏫 Teacher</option>
    </select>

    <input type="email" id="email" placeholder="Enter email">
    <input type="password" id="password" placeholder="Enter password">

    <button id="loginBtn">Login</button>
    <button id="forgotPassword">Forgot Password</button>

  </div>

</div>

<!-- 📊 DASHBOARD -->
<div id="dashboard" style="display:none;">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <h2>📌 Menu</h2>

    <button class="nav-btn active" id="noticeBtn">📄 Notices</button>
    <button class="nav-btn" id="addBtn">➕ Add Notice</button>

    <button class="logout-btn" id="logoutBtn">🚪 Logout</button>

  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- TOP BAR -->
    <div class="top-bar">
      <h1>Dashboard</h1>
    </div>

    <!-- ADD SECTION -->
    <div id="add-section" class="add-notice" style="display:none;">
      <input type="text" id="titleInput" placeholder="Notice Title">
      <textarea id="contentInput" placeholder="Notice Content"></textarea>
      <input type="file" id="fileInput">
      <button onclick="addNotice()">Post Notice</button>
    </div>

    <!-- NOTICES -->
    <div id="notices-section"></div>

  </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
